substitutions:
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: sedaia-repo
  _SERVICE: sedaia-api
  _RUNTIME_SERVICE_ACCOUNT: sedaia-api-runtime@${PROJECT_ID}.iam.gserviceaccount.com
  _RELEASE_EVIDENCE_BUCKET: sedaia-api-release-evidence-${PROJECT_ID}
  _DEPLOYMENT_LOCK_BUCKET: sedaia-api-deployment-lock-${PROJECT_ID}
  _CANONICAL_API_URL: https://api.sedaia-designs.org

steps:
  - id: test-api
    name: gradle:8-jdk21
    entrypoint: ./gradlew
    args:
      - :apps:api:check
      - --no-daemon

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${BUILD_ID}

  - id: deploy-cloud-run-safely
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    env:
      - GCP_PROJECT_ID=${PROJECT_ID}
      - CLOUD_RUN_REGION=${_REGION}
      - CLOUD_RUN_SERVICE=${_SERVICE}
      - RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SERVICE_ACCOUNT}
      - ARTIFACT_REGISTRY_REPOSITORY=${_ARTIFACT_REPOSITORY}
      - CLOUD_BUILD_ID=${BUILD_ID}
      - CI_COMMIT_SHA=${COMMIT_SHA}
      - CI_REPOSITORY=${REPO_FULL_NAME}
      - RELEASE_EVIDENCE_BUCKET=${_RELEASE_EVIDENCE_BUCKET}
      - DEPLOYMENT_LOCK_BUCKET=${_DEPLOYMENT_LOCK_BUCKET}
      - CANONICAL_API_URL=${_CANONICAL_API_URL}
    args:
      - -ceu
      - |
        apt-get update
        apt-get install --no-install-recommends --yes ca-certificates curl jq
        scripts/deploy-cloud-run-safe.sh release-evidence

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE}:${BUILD_ID}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
