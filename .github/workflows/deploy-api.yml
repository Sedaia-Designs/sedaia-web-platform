name: Deploy API

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-production to confirm the production deployment
        required: true
        type: string

permissions:
  contents: read

env:
  GCP_PROJECT_ID: sedaia-web-platform-api-508804
  CLOUD_RUN_REGION: us-central1
  CLOUD_RUN_SERVICE: sedaia-api
  ARTIFACT_REGISTRY_REPOSITORY: sedaia-repo
  CLOUD_BUILD_SERVICE_ACCOUNT: projects/sedaia-web-platform-api-508804/serviceAccounts/sedaia-api-builder@sedaia-web-platform-api-508804.iam.gserviceaccount.com

jobs:
  preflight:
    name: Validate deployment request
    runs-on: ubuntu-latest
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          test "$REQUESTED_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "deploy-production"

  api-check:
    name: Check API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check API
        run: ./gradlew :apps:api:check --no-daemon

  deploy:
    name: Deploy production API
    needs: [preflight, api-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CI_REPOSITORY: ${{ github.repository }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_PIPELINE_ID: ${{ github.run_id }}
      CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CI_JOB_ID: deploy
      CI_JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Submit the production build to Cloud Build
        run: |
          CLOUD_BUILD_ID="$(gcloud builds submit . \
            --config=cloudbuild.yaml \
            --project="$GCP_PROJECT_ID" \
            --region="$CLOUD_RUN_REGION" \
            --service-account="$CLOUD_BUILD_SERVICE_ACCOUNT" \
            --format='value(id)')"
          test -n "$CLOUD_BUILD_ID"
          IMAGE_REPOSITORY="${CLOUD_RUN_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${CLOUD_RUN_SERVICE}"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "${IMAGE_REPOSITORY}:${CLOUD_BUILD_ID}" --format='value(image_summary.digest)')"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "CLOUD_BUILD_ID=$CLOUD_BUILD_ID" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
      - name: Verify Cloud Run revision, digest, and traffic
        run: |
          mkdir -p release-manifests
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$CLOUD_RUN_REGION" \
            --format=json > release-manifests/service.json
          CLOUD_RUN_REVISION="$(jq -r '.status.latestReadyRevisionName' release-manifests/service.json)"
          CLOUD_RUN_SERVICE_URL="$(jq -r '.status.url' release-manifests/service.json)"
          test -n "$CLOUD_RUN_REVISION"
          test -n "$CLOUD_RUN_SERVICE_URL"
          gcloud run revisions describe "$CLOUD_RUN_REVISION" \
            --project="$GCP_PROJECT_ID" --region="$CLOUD_RUN_REGION" \
            --format=json > release-manifests/revision.json
          jq -e --arg revision "$CLOUD_RUN_REVISION" --arg digest "$IMAGE_DIGEST" --arg build_id "$CLOUD_BUILD_ID" '
            .metadata.name == $revision and .metadata.labels["build-id"] == $build_id and
            .status.imageDigest == $digest and
            any(.status.conditions[]; .type == "Ready" and .status == "True")
          ' release-manifests/revision.json >/dev/null
          jq -e --arg revision "$CLOUD_RUN_REVISION" '
            .status.latestCreatedRevisionName == $revision and
            .status.latestReadyRevisionName == $revision and
            ([.status.traffic[] | select(.revisionName == $revision) | .percent] | add) == 100
          ' release-manifests/service.json >/dev/null
          jq -c '.status.traffic' release-manifests/service.json > release-manifests/traffic.json
          echo "CLOUD_RUN_REVISION=$CLOUD_RUN_REVISION" >> "$GITHUB_ENV"
          echo "CLOUD_RUN_SERVICE_URL=$CLOUD_RUN_SERVICE_URL" >> "$GITHUB_ENV"
          echo "FINAL_TRAFFIC_FILE=release-manifests/traffic.json" >> "$GITHUB_ENV"
      - name: Verify production deployment
        run: scripts/verify-api-deployment.sh "$CLOUD_RUN_SERVICE_URL" release-manifests/verification.json
      - name: Create release manifest
        run: |
          scripts/create-release-manifest.sh release-manifests/verification.json release-manifests/release.json
          jq '{status, deployed_at, commit: .source.commit_sha, cloud_build: .cloud_build, cloud_run: .cloud_run, image: .image, traffic: .final_traffic}' release-manifests/release.json
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: api-release-manifest
          path: release-manifests/
          if-no-files-found: error
          retention-days: 30
