name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: Ktor API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check API
        run: ./gradlew :apps:api:check --no-daemon
      - name: Test deployment contracts and rollout ordering
        run: |
          scripts/tests/verify-api-deployment-test.sh
          scripts/tests/deploy-cloud-run-safe-test.sh

  frontends:
    name: Frontends
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate business site
        run: |
          pnpm --filter @sedaia-designs/business-site lint
          pnpm --filter @sedaia-designs/business-site test
          pnpm --filter @sedaia-designs/business-site build
      - name: Validate portfolio
        run: |
          node -e 'const config = require("./apps/portfolio/vercel.json"); if (config.git?.deploymentEnabled !== false) process.exit(1)'
          pnpm --filter @sedaia-designs/portfolio lint
          pnpm --filter @sedaia-designs/portfolio build

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI contract
        run: pnpm contract:lint
