name: Roll back API

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Deploy API workflow run ID to restore
        required: true
        type: string
      reason:
        description: Incident or drill reason
        required: true
        type: string
      confirmation:
        description: Type rollback-production to confirm the production rollback
        required: true
        type: string

permissions:
  contents: read

env:
  GCP_PROJECT_ID: sedaia-web-platform-api-508804
  CLOUD_RUN_REGION: us-central1
  CLOUD_RUN_SERVICE: sedaia-api

jobs:
  rollback:
    name: Roll back production API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-api
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CI_PIPELINE_ID: ${{ github.run_id }}
      CI_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      ROLLBACK_REASON: ${{ inputs.reason }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          test "$REQUESTED_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "rollback-production"
          case "$RELEASE_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test -n "$ROLLBACK_REASON"
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Download known-good release manifest
        run: gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name api-release-manifest --dir supplied-release
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify release provenance, revision, and digest
        run: scripts/verify-github-release-manifest-provenance.sh "$RELEASE_RUN_ID" supplied-release/release.json verified-release.json
      - name: Route traffic to the known-good Cloud Run revision and verify
        run: scripts/rollback-api.sh verified-release.json
      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-rollback-${{ github.run_id }}
          path: |
            rollback-manifest.json
            rollback-verification.json
            rollback-service-before.json
            rollback-service-after.json
            verified-release.json
          if-no-files-found: warn
          retention-days: 30
